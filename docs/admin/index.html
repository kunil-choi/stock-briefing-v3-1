<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>머니올라 브리핑 통합 관리자</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
  --border: #30363d; --text: #e6edf3; --muted: #8b949e;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149;
  --orange: #d29922; --purple: #bc8cff;
}
body { background: var(--bg); color: var(--text);
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  line-height: 1.6; padding-bottom: 4rem; }
.header { background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 1.1rem; font-weight: 700; }
.header .subtitle { font-size: .78rem; color: var(--muted); margin-top: .1rem; }
#login-form { max-width: 380px; margin: 6rem auto; padding: 2rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
#login-form h2 { font-size: 1.1rem; margin-bottom: .6rem; text-align: center; }
#login-form .warn { font-size: .75rem; color: var(--orange); margin-bottom: 1rem; text-align: center; }
#login-form input { width: 100%; padding: .6rem .9rem; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-size: .9rem; margin-bottom: .8rem; }
#login-form button { width: 100%; padding: .65rem; background: var(--accent);
  border: none; border-radius: 6px; color: #000; font-weight: 700;
  font-size: .95rem; cursor: pointer; }
.container { max-width: 1040px; margin: 0 auto; padding: 1.5rem 1rem; }

/* 상단 저장소(V3-1/V3-2/V3) 메뉴 */
.repo-menu { display: flex; gap: .5rem; padding: 0 1rem; max-width: 1040px; margin: 0 auto;
  border-bottom: 1px solid var(--border); background: var(--surface); }
.repo-tab { padding: .7rem 1.3rem; font-size: .92rem; font-weight: 700; color: var(--muted);
  cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent;
  transition: all .15s; }
.repo-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.repo-tab .repo-sub { display: block; font-size: .68rem; font-weight: 400; color: var(--muted); margin-top: .1rem; }

.tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; }
.tab { padding: .5rem 1.1rem; font-size: .88rem; font-weight: 600;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s; background: none; border-top: none;
  border-left: none; border-right: none; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.subtabs-sm { display: flex; gap: .4rem; margin-bottom: 1rem; }
.subtab-sm { padding: .35rem .8rem; font-size: .8rem; font-weight: 600; color: var(--muted);
  cursor: pointer; border: 1px solid var(--border); background: var(--surface2); border-radius: 6px; }
.subtab-sm.active { color: #000; background: var(--accent); border-color: var(--accent); }

.section-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem;
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.badge { font-size: .72rem; padding: .15rem .5rem; border-radius: 20px;
  font-weight: 700; }
.badge-orange { background: #d2992222; color: var(--orange); border: 1px solid #d2992244; }
.badge-green  { background: #3fb95022; color: var(--green);  border: 1px solid #3fb95044; }
.badge-red    { background: #f8514922; color: var(--red);    border: 1px solid #f8514944; }
.badge-blue   { background: #58a6ff22; color: var(--accent); border: 1px solid #58a6ff44; }
.badge-purple { background: #bc8cff22; color: var(--purple); border: 1px solid #bc8cff44; }
.card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: .75rem; overflow: hidden; }
.card-header { padding: .75rem 1rem; background: var(--surface2);
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.card-body { padding: .75rem 1rem; }
.card-name { font-size: 1rem; font-weight: 700; flex: 1; }
.card-meta { font-size: .78rem; color: var(--muted); }
.sample-list { list-style: none; padding: 0; margin: .4rem 0; }
.sample-list li { font-size: .8rem; color: var(--muted); padding: .2rem 0;
  border-bottom: 1px solid var(--border); }
.sample-list li:last-child { border: none; }
.btn-row { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
.btn { padding: .4rem .9rem; border-radius: 6px; font-size: .82rem;
  font-weight: 700; cursor: pointer; border: none; transition: opacity .15s; }
.btn:hover { opacity: .8; }
.btn-approve { background: var(--green); color: #000; }
.btn-reject  { background: var(--surface2); color: var(--red);
  border: 1px solid var(--red); }
.btn-move    { background: var(--surface2); color: var(--accent);
  border: 1px solid var(--accent); }
.btn-sm { padding: .25rem .6rem; font-size: .75rem; }
.cat-select { padding: .3rem .5rem; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 5px; color: var(--text);
  font-size: .82rem; }
.channel-id-input { padding: .3rem .5rem; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 5px; color: var(--text);
  font-size: .82rem; width: 200px; }
.registered-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.registered-table th { background: var(--surface2); padding: .5rem .75rem;
  text-align: left; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--border); }
.registered-table td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); }
.registered-table tr:last-child td { border: none; }
.btn-delete { background: var(--surface2); color: var(--red);
  border: 1px solid #f8514944; }
.btn-delete:hover { background: #f8514922; }
.registered-table td.action-cell { width: 110px; text-align: center; white-space: nowrap; }
.expert-tag { display: inline-block; background: var(--purple); color: #000;
  font-size: .7rem; padding: .1rem .4rem; border-radius: 3px;
  font-weight: 700; margin: .1rem; }
.count-badge { background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; font-size: .72rem; padding: .1rem .45rem; color: var(--muted); }
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: .75rem 1.2rem; font-size: .88rem; z-index: 999;
  transform: translateY(100px); transition: transform .3s; max-width: 60vw; }
.toast.show { transform: translateY(0); }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error   { border-color: var(--red); color: var(--red); }
.empty { text-align: center; padding: 2.5rem; color: var(--muted); font-size: .9rem; }
.loading { text-align: center; padding: 2rem; color: var(--muted); }
.spinner { display: inline-block; width: 20px; height: 20px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; margin-right: .5rem; }
@keyframes spin { to { transform: rotate(360deg); } }

textarea, input[type=text] { font-family: inherit; }
.field-block { margin-bottom: .9rem; }
.field-label { font-size: .78rem; color: var(--muted); margin-bottom: .3rem; display: flex;
  align-items: center; gap: .4rem; }
.field-textarea { width: 100%; padding: .55rem .75rem; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-size: .84rem; resize: vertical; line-height: 1.55; }
details.card-acc { background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: .6rem; overflow: hidden; }
details.card-acc > summary { padding: .7rem 1rem; background: var(--surface2); cursor: pointer;
  font-size: .9rem; font-weight: 700; list-style: none; display: flex; align-items: center; gap: .6rem; }
details.card-acc > summary::-webkit-details-marker { display: none; }
details.card-acc > summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
details.card-acc[open] > summary::before { transform: rotate(90deg); }
details.card-acc .acc-body { padding: 1rem; }
.card-list-row { display: flex; align-items: center; gap: .75rem; padding: .6rem .8rem;
  border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-list-row:last-child { border: none; }
.card-list-row .name { font-weight: 700; flex: 1; min-width: 140px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
@media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }
.notice { font-size: .8rem; color: var(--muted); background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px; padding: .7rem .9rem; margin-bottom: 1rem; }

/* 승인 전 대기 변경사항 표시줄 */
.pending-bar { background: #d2992215; border: 1px solid var(--orange); border-radius: 10px;
  padding: .9rem 1rem; margin: 1rem 0; }
.pending-bar.empty-state { background: var(--surface2); border-color: var(--border); }
.pending-bar-title { font-size: .88rem; font-weight: 700; color: var(--orange); margin-bottom: .5rem;
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.pending-bar.empty-state .pending-bar-title { color: var(--muted); }
.pending-list { list-style: none; font-size: .8rem; color: var(--text); margin: 0 0 .8rem; padding: 0; }
.pending-list li { padding: .2rem 0; }
.workflow-status { font-size: .8rem; color: var(--muted); margin-top: .6rem; }

/* 미리보기 패널 */
.preview-pane { border: 1px dashed var(--border); border-radius: 10px; padding: 1rem; margin-top: 1.2rem; }
.preview-pane-title { font-size: .88rem; font-weight: 700; margin-bottom: .3rem; }
.preview-pane-note { font-size: .74rem; color: var(--muted); margin-bottom: .9rem; }
.preview-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: .8rem .9rem; margin-bottom: .6rem; }
.preview-card-name { font-weight: 700; font-size: .92rem; margin-bottom: .4rem;
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.preview-field { font-size: .8rem; color: var(--text); margin-bottom: .35rem; line-height: 1.5; }
.preview-field b { color: var(--muted); font-weight: 600; margin-right: .3rem; }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-form">
    <h2>🔐 브리핑 통합 관리자</h2>
    <p class="warn">⚠️ 이 페이지 URL과 GitHub 토큰은 반드시 비공개로 유지하세요.</p>
    <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">로그인</button>
    <p id="login-err" style="color:var(--red);font-size:.8rem;margin-top:.5rem;text-align:center;"></p>
  </div>
</div>

<div id="main-screen" style="display:none;">
  <div class="header">
    <div>
      <div style="font-size:1.1rem;font-weight:700;">🛠 머니올라 브리핑 통합 관리자</div>
      <div class="subtitle" id="header-time"></div>
    </div>
    <button class="btn btn-sm" style="background:var(--surface2);color:var(--muted);" onclick="logout()">로그아웃</button>
  </div>

  <div class="repo-menu" id="repo-menu"></div>

  <div class="container">
    <div id="repo-view"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 저장소 설정 ───────────────────────────────────────────────────────
// FIX-ADMIN-UNIFY-1: 기존엔 admin 페이지가 stock-briefing-v3 저장소 하나만
// 대상으로 REPO 상수가 고정돼 있었다. 이제 오전(v3-1/v3-2)·오후(v3) 세
// 저장소를 한 페이지에서 관리해야 하므로 REPO를 상수가 아니라 선택 가능한
// 설정 객체로 바꾸고, 모든 GitHub API 호출에 repoCfg를 인자로 넘긴다.
//
// schema: 'stock'     → market_leaders[]/stocks[] 구조 (v3-1, v3 — v3는 아직
//                        파이프라인이 없어 스키마를 v3-1과 동일하다고 가정)
//         'report'    → v3-2 report_update 구조 (analyst_briefing/brokerage_reports 등)
//         'thumbnail' → ADMIN-THUMBNAIL-EDIT-1: stock-briefing-step1의 YouTube
//                        썸네일(발언형/뉴스형) 문구만 수정하는 전용 스키마.
//                        briefing_data.json이 아니라 docs/thumbnails/latest_meta.json을
//                        다루고, "변경 승인" 배치가 아니라 카드별 버튼이 그 자리에서
//                        바로 경량 워크플로우를 트리거한다(아래 renderThumbnailTab 참고).
const REPOS = {
  v3_1: { key: "v3_1", label: "V3-1", sub: "오전 · morning_core",
          repo: "kunil-choi/stock-briefing-v3-1", branch: "main", schema: "stock" },
  v3_2: { key: "v3_2", label: "V3-2", sub: "오전 · report_update",
          repo: "kunil-choi/stock-briefing-v3-2", branch: "main", schema: "report" },
  v3:   { key: "v3",   label: "V3",   sub: "오후 · 마감 브리핑 (준비중)",
          repo: "kunil-choi/stock-briefing-v3", branch: "main", schema: "stock" },
  step1: { key: "step1", label: "STEP-1", sub: "오전 · 썸네일",
          repo: "kunil-choi/stock-briefing-step1", branch: "main", schema: "thumbnail" },
};
let activeRepoKey = "v3_1";
let GH_TOKEN = "";
// 저장소별 캐시: 브리핑 JSON, sha, 서브탭 상태 등을 보관
// pending/pendingLog: "변경 승인" 전까지 브라우저 메모리에만 쌓이는 임시 수정
// 사항. 카드 이동/삭제, 텍스트 수정 모두 이 상태를 거쳐 쌓이고, GitHub에는
// approveChanges()가 한 번에 반영한다(REGEN-PREVIEW-1).
const state = {
  v3_1: { subtab: "registered", correctTab: "text", briefing: null, briefingSha: null,
          pending: false, pendingLog: [] },
  v3_2: { subtab: "brokerRegistered", correctTab: "text", briefing: null, briefingSha: null,
          pending: false, pendingLog: [] },
  v3:   { subtab: "correct", correctTab: "text", briefing: null, briefingSha: null,
          pending: false, pendingLog: [] },
  step1: { subtab: "thumbnail" },
};

// ── 인증 ──────────────────────────────────────────────────────────
const PW_HASH = "stock2026!";
function login() {
  const pw = document.getElementById("pw-input").value;
  if (pw !== PW_HASH) {
    document.getElementById("login-err").textContent = "비밀번호가 틀렸습니다.";
    return;
  }
  GH_TOKEN = prompt("GitHub Personal Access Token 입력 (v3-1 / v3-2 / v3 저장소 repo 권한 필요):");
  if (!GH_TOKEN) { document.getElementById("login-err").textContent = "토큰이 필요합니다."; return; }
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("main-screen").style.display = "block";
  document.getElementById("header-time").textContent =
    new Date().toLocaleString("ko-KR", {timeZone:"Asia/Seoul"}) + " KST";
  renderRepoMenu();
  selectRepo(activeRepoKey);
}
function logout() {
  GH_TOKEN = "";
  location.reload();
}

// ── GitHub API 공통 ──────────────────────────────────────────────
function b64EncodeUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(str) { return decodeURIComponent(escape(atob(str))); }

async function ghGet(repoCfg, path) {
  // cache: "no-store" 없이는 브라우저가 동일 URL GET을 캐시해서, 방금
  // ghUpdate()로 sha가 바뀐 직후에도 이전 sha를 돌려줄 수 있다. 그 상태로
  // 다음 저장이 그 sha로 PUT을 보내면 GitHub가 409(sha 불일치)로 거부한다.
  const r = await fetch(`https://api.github.com/repos/${repoCfg.repo}/contents/${path}?ref=${repoCfg.branch}`, {
    headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json" },
    cache: "no-store"
  });
  if (!r.ok) throw new Error(`GET ${repoCfg.repo}/${path} → ${r.status}`);
  return r.json();
}
async function ghUpdate(repoCfg, path, content, sha, message) {
  const body = { message, content: b64EncodeUtf8(content), branch: repoCfg.branch };
  if (sha) body.sha = sha;
  const r = await fetch(`https://api.github.com/repos/${repoCfg.repo}/contents/${path}`, {
    method: "PUT",
    headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json",
               "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) { const e = await r.json().catch(() => ({message: r.statusText})); throw new Error(e.message); }
  return r.json();
}
async function readJson(repoCfg, path, fallback) {
  try {
    const d = await ghGet(repoCfg, path);
    return { data: JSON.parse(b64DecodeUtf8(d.content)), sha: d.sha };
  } catch(e) { return { data: fallback, sha: null, error: e }; }
}

// FIX-ADMIN-UNIFY-2: 옛 admin 페이지는 패널리스트 추가/삭제 시
// `cfgContent.replace("김학균\", \"김한진,\\n]", ...)`처럼 파일 끝부분의
// 리터럴 문자열을 그대로 찾아 바꾸는 방식이었다 — 목록이 조금만 바뀌어도
// 아무 매치 없이 조용히 실패(무변화 커밋)할 수 있는 방식이라, 정규식으로
// "VAR = [ ... ]" 블록 전체를 뽑아 배열로 다루고 통째로 재작성하는 방식으로
// 교체했다. 패널리스트(config.py)와 증권사(analyst_collector.py) 양쪽에 공용.
function extractPyStrList(content, varName) {
  const re = new RegExp(`${varName}\\s*=\\s*\\[([\\s\\S]*?)\\]`);
  const m = content.match(re);
  if (!m) return null;
  return [...m[1].matchAll(/"([^"]+)"/g)].map(x => x[1]);
}
function rebuildPyStrList(content, varName, names, indent = "    ") {
  const re = new RegExp(`(${varName}\\s*=\\s*\\[)([\\s\\S]*?)(\\])`);
  const m = content.match(re);
  if (!m) throw new Error(`${varName} 목록을 파일에서 찾을 수 없습니다`);
  const body = names.map(n => `${indent}"${n}",`).join("\n");
  return content.slice(0, m.index) + m[1] + "\n" + body + "\n" + m[3] + content.slice(m.index + m[0].length);
}

// ── 공통 유틸 ─────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = "toast", 2600);
}
function renderSampleVideo(v) {
  const title = typeof v === "string" ? v : (v?.title || "");
  const url   = (typeof v === "object" && v?.url) ? v.url
    : `https://www.youtube.com/results?search_query=${encodeURIComponent(title)}`;
  const channelName = (typeof v === "object" && v?.channel_name) ? v.channel_name : "";
  const channelId   = (typeof v === "object" && v?.channel_id)   ? v.channel_id   : "";
  let channelLink = "";
  if (channelName) {
    const channelUrl = channelId
      ? `https://www.youtube.com/channel/${channelId}`
      : `https://www.youtube.com/results?search_query=${encodeURIComponent(channelName)}`;
    channelLink = ` <a href="${escapeHtml(channelUrl)}" target="_blank" rel="noopener noreferrer"
      style="color:var(--muted);text-decoration:underline;font-size:.85em;">(${escapeHtml(channelName)})</a>`;
  }
  return `<li>▸ <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"
    style="color:inherit;text-decoration:underline;">${escapeHtml(title)}</a>${channelLink}</li>`;
}

// ── 상단 저장소 메뉴 ──────────────────────────────────────────────
function renderRepoMenu() {
  const el = document.getElementById("repo-menu");
  el.innerHTML = Object.values(REPOS).map(r => `
    <button class="repo-tab ${r.key === activeRepoKey ? "active" : ""}" onclick="selectRepo('${r.key}')">
      ${r.label}<span class="repo-sub">${r.sub}</span>
    </button>`).join("");
}

// ── 저장소별 뷰 구성 ──────────────────────────────────────────────
function renderRepoView() {
  const repoCfg = REPOS[activeRepoKey];
  const el = document.getElementById("repo-view");

  let subtabDefs;
  if (repoCfg.key === "v3_1") {
    subtabDefs = [
      ["registered", "✅ 등록 현황"],
      ["channelCand", "📺 채널 후보"],
      ["panelistCand", "👤 패널리스트 후보"],
      ["add", "➕ 직접 추가"],
      ["correct", "🩹 브리핑 교정"],
      ["video", "🎬 오늘의 영상"],
    ];
  } else if (repoCfg.key === "v3_2") {
    subtabDefs = [
      ["brokerRegistered", "✅ 증권사 등록 현황"],
      ["brokerCand", "🏦 증권사 후보"],
      ["correct", "🩹 브리핑 교정"],
      ["video", "🎬 오늘의 영상"],
    ];
  } else if (repoCfg.key === "step1") {
    subtabDefs = [
      ["thumbnail", "🖼️ 썸네일 수정"],
    ];
  } else {
    subtabDefs = [
      ["correct", "🩹 브리핑 교정"],
    ];
  }

  const st = state[repoCfg.key];
  if (!subtabDefs.some(([k]) => k === st.subtab)) st.subtab = subtabDefs[0][0];

  el.innerHTML = `
    <div class="tabs">
      ${subtabDefs.map(([k, label]) => `
        <button class="tab ${st.subtab === k ? "active" : ""}" onclick="switchSubtab('${k}')">${label}</button>
      `).join("")}
    </div>
    <div id="subtab-body"></div>
  `;
  renderSubtabBody();
}

function switchSubtab(name) {
  state[activeRepoKey].subtab = name;
  renderRepoView();
}

function renderSubtabBody() {
  const repoCfg = REPOS[activeRepoKey];
  const st = state[repoCfg.key];
  const body = document.getElementById("subtab-body");

  if (st.subtab === "registered") { body.innerHTML = `<div class="loading"><span class="spinner"></span>로딩 중...</div>`; loadRegisteredPanelChannel(repoCfg); return; }
  if (st.subtab === "channelCand") { renderPlaceholder(body, "📺 채널 후보 자동 발견"); return; }
  if (st.subtab === "panelistCand") { renderPlaceholder(body, "👤 패널리스트 후보 자동 발견"); return; }
  if (st.subtab === "add") { renderAddDirect(body, repoCfg); return; }
  if (st.subtab === "brokerRegistered") { body.innerHTML = `<div class="loading"><span class="spinner"></span>로딩 중...</div>`; loadRegisteredBrokers(repoCfg); return; }
  if (st.subtab === "brokerCand") { renderPlaceholder(body, "🏦 증권사 후보 자동 발견"); return; }
  if (st.subtab === "correct") { renderCorrect(body, repoCfg); return; }
  if (st.subtab === "video") { renderVideoTab(body, repoCfg); return; }
  if (st.subtab === "thumbnail") { renderThumbnailTab(body, repoCfg); return; }
}

function renderPlaceholder(el, title) {
  el.innerHTML = `
    <div class="section-title">${title} <span class="badge badge-orange">준비중</span></div>
    <div class="empty">
      ⏳ 이 기능은 자리만 먼저 만들어 두었습니다.<br>
      새로운 후보를 자동으로 찾아 쌓아두는 백엔드(수집기 쪽 발견 로직)는 별도 작업으로 예정돼 있습니다.
    </div>`;
}

    let html = `

              <td class="action-cell">

          </tbody>
        </table>
      </div>
      <div><div class="section-title" style="margin-bottom:.75rem;">📺 등록 채널</div>`;

    for (const [cat, label] of Object.entries(catLabel)) {
      const chs = channels[cat] || [];
      html += `
        <div style="margin-bottom:1.2rem;">
          <div style="font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:.5rem;">${label} (${chs.length}개)</div>

                <td>${escapeHtml(c.name || c)}</td>

                <td class="action-cell">
                  <button class="btn btn-delete btn-sm" onclick="deleteChannelDirect('${cat}','${c.id || ""}','${(c.name || c).replace(/'/g, "\\'")}')">🗑</button>
                </td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }
    html += `</div>`;
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="empty" style="color:var(--red);">로드 실패: ${escapeHtml(e.message)}</div>`;
  }

async function deletePanelistDirect(name) {
  const repoCfg = REPOS.v3_1;
  if (!confirm(`"${name}" 패널리스트를 삭제할까요?`)) return;
  try {
    const cfg = await ghGet(repoCfg, "config.py");
    const cfgContent = b64DecodeUtf8(cfg.content);
    const names = extractPyStrList(cfgContent, "POPULAR_PANELISTS") || [];
    if (!names.includes(name)) { showToast(`${name} 을(를) 찾을 수 없음`, "error"); return; }
    const updated = rebuildPyStrList(cfgContent, "POPULAR_PANELISTS", names.filter(n => n !== name));
    await ghUpdate(repoCfg, "config.py", updated, cfg.sha, `admin: 패널리스트 삭제 — ${name}`);
    showToast(`🗑 ${name} 패널리스트 삭제 완료`);
    loadRegisteredPanelChannel(repoCfg);
  } catch(e) { showToast(`오류: ${e.message}`, "error"); }
}

async function deleteChannelDirect(cat, chId, chName) {
  const repoCfg = REPOS.v3_1;

    const before = (channels[cat] || []).length;
    channels[cat] = (channels[cat] || []).filter(c => (c.id || c) !== chId);

    await ghUpdate(repoCfg, "channels.json", JSON.stringify(channels, null, 2), cj.sha,

async function addChannelDirect() {
  const repoCfg = REPOS.v3_1;
  const chName = document.getElementById("add-ch-name").value.trim();
  const chId   = document.getElementById("add-ch-id").value.trim();
  const cat    = document.getElementById("add-ch-cat").value;
  if (!chName) { showToast("채널명을 입력하세요", "error"); return; }
  if (!chId || !chId.startsWith("UC")) { showToast("채널 ID를 확인하세요 (UC로 시작)", "error"); return; }
  try {
    const cj = await ghGet(repoCfg, "channels.json");
    let channels = JSON.parse(b64DecodeUtf8(cj.content));
    for (const c of Object.values(channels).flat()) {
      if (typeof c === "object" && c.id === chId) { showToast("이미 등록된 채널 ID", "error"); return; }
    }
    channels[cat] = channels[cat] || [];
    channels[cat].push({ id: chId, name: chName });
    await ghUpdate(repoCfg, "channels.json", JSON.stringify(channels, null, 2), cj.sha,
      `admin: 채널 직접 추가 — ${chName} (${cat})`);

async function loadBriefingForCorrection() {
  const repoCfg = REPOS[activeRepoKey];
  const st = state[repoCfg.key];
  // VIDEO-TAB-1: 이 함수는 "브리핑 교정" 탭뿐 아니라 "오늘의 영상" 탭의
  // 불러오기 버튼에서도 공용으로 쓰인다 — 두 탭은 서로 다른 DOM을 갖고
  // 있어(correct-status/correct-inner vs video-inner) 활성 탭이 아닌 쪽의
  // 엘리먼트는 없을 수 있으므로 모든 DOM 접근에 존재 여부를 확인한다.
  const statusEl = document.getElementById("correct-status");
  if (statusEl) statusEl.textContent = "불러오는 중...";
  try {
    const d = await ghGet(repoCfg, BRIEFING_PATH);
    st.briefing = JSON.parse(b64DecodeUtf8(d.content));
    st.briefingSha = d.sha;
    // REGEN-PREVIEW-1: 새로 불러오면 GitHub의 최신 상태로 되돌아온 것이므로
    // 이전에 쌓여 있던(승인 전) 임시 수정 내역은 모두 버린다.
    st.pending = false;
    st.pendingLog = [];
    if (statusEl) statusEl.textContent = `✅ 로드 완료 (${new Date().toLocaleTimeString("ko-KR")})`;
    if (document.getElementById("correct-inner")) {
      _renderCorrectInner(repoCfg);
      _refreshPendingBar(repoCfg);
      _refreshPreview(repoCfg);
      loadCorrectionLog(repoCfg);
    }
    if (document.getElementById("video-inner")) {
      _renderVideoInner(repoCfg);
      _refreshVideoPendingBar(repoCfg);
    }
  } catch(e) {
    if (statusEl) statusEl.textContent = `❌ 로드 실패: ${e.message} (아직 브리핑이 생성되지 않았을 수 있습니다)`;
    else showToast(`로드 실패: ${e.message}`, "error");
  }
}

async function saveBriefingJson(repoCfg, message) {
  const st = state[repoCfg.key];
  const d = await ghUpdate(repoCfg, BRIEFING_PATH, JSON.stringify(st.briefing, null, 2), st.briefingSha, message);
  const fresh = await ghGet(repoCfg, BRIEFING_PATH);
  st.briefingSha = fresh.sha;
  return d;
}

async function appendCorrectionLog(repoCfg, entry) {
  const ts = new Date().toLocaleString("ko-KR", {timeZone: "Asia/Seoul"});
  const newEntry = { timestamp: ts, ...entry };
  try {
    let entries = [];
    let sha = null;
    try {
      const d = await ghGet(repoCfg, CORRECTIONS_LOG_PATH);
      entries = JSON.parse(b64DecodeUtf8(d.content));
      sha = d.sha;
    } catch(e) { /* 파일 없으면 새로 생성 */ }
    entries.push(newEntry);
    const body = { message: `admin: 교정 이력 기록 — ${newEntry.action}`,
                   content: b64EncodeUtf8(JSON.stringify(entries, null, 2)), branch: repoCfg.branch };
    if (sha) body.sha = sha;
    await fetch(`https://api.github.com/repos/${repoCfg.repo}/contents/${CORRECTIONS_LOG_PATH}`, {
      method: "PUT",
      headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json",
                 "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    loadCorrectionLog(repoCfg);
  } catch(e) { console.warn("교정 이력 저장 실패:", e); }
}

async function loadCorrectionLog(repoCfg) {
  const el = document.getElementById("correct-log");
  if (!el) return;
  try {
    const { data } = await readJson(repoCfg, CORRECTIONS_LOG_PATH, []);
    const entries = Array.isArray(data) ? [...data].reverse().slice(0, 20) : [];
    if (!entries.length) { el.innerHTML = '<div style="color:var(--muted);font-size:.82rem;">교정 이력이 없습니다.</div>'; return; }
    el.innerHTML = entries.map(e => `
      <div style="display:flex;gap:.75rem;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.8rem;">
        <span style="color:var(--muted);flex-shrink:0;">${escapeHtml(e.timestamp || "")}</span>
        <span style="color:var(--accent);">${escapeHtml(e.action || "")}</span>
        <span>${escapeHtml(e.detail || "")}</span>
      </div>`).join("");
  } catch(e) {
    el.innerHTML = `<div style="color:var(--muted);font-size:.82rem;">이력 로드 실패: ${e.message}</div>`;
  }
}

// GitHub Actions 워크플로우 트리거, 두 단계가 순서대로 일어난다.
function _markPending(repoCfg, logEntry) {
  const st = state[repoCfg.key];

  _refreshPreview(repoCfg);
}

async function approveChanges() {
  const repoCfg = REPOS[activeRepoKey];
  const st = state[repoCfg.key];
  if (!st.pending) { showToast("승인할 변경사항이 없습니다", "error"); return; }
  if (!confirm(`저장되지 않은 변경 ${st.pendingLog.length}건을 저장하고, 브리핑 페이지도 다시 만들까요?`)) return;
  const wfEl = document.getElementById("workflow-status");
  try {
    if (wfEl) wfEl.textContent = "💾 data/briefing_data.json 저장 중...";
    await saveBriefingJson(repoCfg, `admin: 브리핑 교정 승인 — ${st.pendingLog.length}건`);
    await appendCorrectionLog(repoCfg, {
      action: "approve_batch",
      detail: st.pendingLog.map(e => e.detail || e.action).join(" / "),
    });

    if (wfEl) wfEl.textContent = "🚀 페이지 재생성 워크플로우 트리거 중...";
    const dispatchedAt = await triggerRegeneratePreview(repoCfg);

    st.pending = false;
    st.pendingLog = [];
    _refreshPendingBar(repoCfg);
    showToast("✅ 저장 완료 — 페이지 재생성 진행 중");
    pollWorkflowStatus(repoCfg, dispatchedAt, 0);
  } catch(e) {
    showToast(`오류: ${e.message}`, "error");
    if (wfEl) wfEl.textContent = `❌ 승인 처리 중 오류: ${e.message}`;
  }
}

async function discardChanges() {
  const repoCfg = REPOS[activeRepoKey];
  const st = state[repoCfg.key];
  if (!st.pending) { showToast("취소할 변경사항이 없습니다", "error"); return; }
  if (!confirm(`저장되지 않은 변경 ${st.pendingLog.length}건을 모두 버리고 GitHub의 최신 내용으로 다시 불러올까요?`)) return;
  await loadBriefingForCorrection();
  showToast("변경사항을 취소했습니다");
}

// REGEN-PREVIEW-1: "변경 승인" 시 이 워크플로우(regenerate_preview.yml)를
// workflow_dispatch로 트리거해, Claude/Gemini 재호출 없이 scripts/regenerate_preview.py로
// 최신 briefing_data.json을 docs/index.html에 반영한다. v3-1/v3-2 양쪽에 동일한
// 파일명으로 만들어 둬야 한다. v3(오후) 저장소는 아직 파이프라인/워크플로우 자체가
// 없어 트리거를 시도하지 않고 안내만 한다.
const REGEN_WORKFLOW_FILE = "regenerate_preview.yml";

async function triggerRegeneratePreview(repoCfg) {
  if (repoCfg.key === "v3") {
    showToast("V3 저장소는 아직 재생성 워크플로우가 없습니다 — JSON만 저장됐습니다", "error");
    return null;
  }
  const dispatchedAt = new Date();
  const r = await fetch(`https://api.github.com/repos/${repoCfg.repo}/actions/workflows/${REGEN_WORKFLOW_FILE}/dispatches`, {
    method: "POST",
    headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json",
               "Content-Type": "application/json" },
    body: JSON.stringify({ ref: repoCfg.branch })
  });
  if (!r.ok) {
    const t = await r.text().catch(() => "");
    throw new Error(`재생성 워크플로우 트리거 실패 (${r.status}): ${t.slice(0, 200)}`);
  }
  return dispatchedAt;
}

async function pollWorkflowStatus(repoCfg, dispatchedAt, attempts) {
  const wfEl = document.getElementById("workflow-status");
  if (!dispatchedAt) return; // v3처럼 트리거 자체를 안 한 경우
  if (!wfEl) return;
  try {
    const r = await fetch(
      `https://api.github.com/repos/${repoCfg.repo}/actions/workflows/${REGEN_WORKFLOW_FILE}/runs?per_page=5`,
      { headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json" }, cache: "no-store" }
    );
    const j = await r.json();
    const run = (j.workflow_runs || []).find(x => new Date(x.created_at) >= dispatchedAt);
    if (run) {
      if (run.status !== "completed") {
        wfEl.textContent = `⏳ 페이지 재생성 워크플로우: ${run.status}...`;
      } else if (run.conclusion === "success") {
        wfEl.textContent = "✅ 페이지 재생성 완료 — 브리핑 페이지에 반영됐습니다.";
        return;
      } else {
        wfEl.textContent = `❌ 페이지 재생성 워크플로우 실패 (${run.conclusion}) — Actions 탭에서 확인하세요.`;
        return;
      }
    } else {
      wfEl.textContent = "⏳ 페이지 재생성 워크플로우 시작 대기 중...";
    }
  } catch(e) {
    wfEl.textContent = `⚠️ 상태 확인 중 오류: ${e.message}`;
  }
  if (attempts < 30) {
    setTimeout(() => pollWorkflowStatus(repoCfg, dispatchedAt, attempts + 1), 4000);
  } else {
    wfEl.textContent = "⚠️ 상태 확인 시간 초과 — GitHub Actions 탭에서 직접 확인하세요.";
  }
}

  return (data[bucket] || []).findIndex(c => c.name === name);

function _renumber(list) { list.forEach((c, i) => { c.rank = i + 1; }); }

function moveCard_stock(bucket, name) {
  const repoCfg = REPOS[activeRepoKey];
  const data = state[repoCfg.key].briefing;
  const from = bucket;
  const to   = bucket === "market_leaders" ? "stocks" : "market_leaders";
  const idx  = _findCardIndex(data, from, name);
  if (idx === -1) { showToast("카드를 찾을 수 없습니다", "error"); return; }

  if (to === "market_leaders" && (data.market_leaders || []).length >= 2) {
    if (!confirm(`대형 주도주가 이미 ${data.market_leaders.length}개입니다. "${name}"을(를) 추가해 ${data.market_leaders.length + 1}개로 만들까요? (보통은 2개를 유지합니다)`)) return;
  }
  if (!confirm(`"${name}"을(를) ${to === "market_leaders" ? "대형 주도주로" : "관심종목으로"} 옮길까요? (아직 저장은 안 됩니다 — 승인 전까지는 임시 반영)`)) return;

  const [card] = data[from].splice(idx, 1);
  data[to] = data[to] || [];
  data[to].push(card);
  _renumber(data.market_leaders || []);
  _renumber(data.stocks || []);

  _markPending(repoCfg, { action: "move_card", detail: `${name}: ${from} → ${to}` });

}

      정보라 신뢰할 수 있지만, 발언자명(왼쪽)은 AI 추정값이라 틀릴 수 있습니다

              <div class="btn-row" style="margin-top:.5rem;">
                <button class="btn btn-delete btn-sm" onclick="deletePanelistQuote_stock('${bucket}',${idx},${qi})">🗑 이 발언 삭제</button>
                ${q.source_url ? `<a href="${escapeHtml(q.source_url)}" target="_blank" rel="noopener noreferrer"
                  style="font-size:.78rem;color:var(--accent);align-self:center;">원본 영상 확인 →</a>` : ""}
              </div>
            </div>
          `).join("")}
        </div>
      </details>
    `).join("")}
    <button class="btn btn-approve" style="margin-top:.5rem;" onclick="applyCorrectPanelist_stock()">📝 이 내용 반영 (미리보기용, 승인 전)</button>
  `;
}

function applyCorrectPanelist_stock() {
  const repoCfg = REPOS[activeRepoKey];
  const data = state[repoCfg.key].briefing;
  const cards = _stockAllCards(data);
  let changed = 0;
  cards.forEach(({ bucket, idx, card }) => {
    (card.panelist_quotes || []).forEach((q, qi) => {
      const speakerEl = document.getElementById(`pq-${bucket}-${idx}-${qi}-speaker`);
      const sourceEl  = document.getElementById(`pq-${bucket}-${idx}-${qi}-source`);
      const factEl    = document.getElementById(`pq-${bucket}-${idx}-${qi}-fact`);
      if (!speakerEl || !sourceEl || !factEl) return; // 이 렌더에 없는 항목(다른 탭 등)
      const newSpeaker = speakerEl.value.trim();
      const newSource  = sourceEl.value.trim();
      const newFact    = factEl.value.trim();
      if (newSpeaker !== (q.speaker_name || "") || newSource !== (q.source_name || "") || newFact !== (q.fact || "")) {
        q.speaker_name = newSpeaker;
        q.source_name  = newSource;
        q.fact         = newFact;
        changed++;
      }
    });
  });
  if (!changed) { showToast("변경된 내용이 없습니다"); return; }
  _markPending(repoCfg, { action: "edit_panelist_quote", detail: `패널 발언 ${changed}건 수정` });
  showToast(`📝 패널 발언 ${changed}건 임시 반영 — 승인 전까지 저장 안 됨`);
}

function deletePanelistQuote_stock(bucket, cardIdx, quoteIdx) {
  const repoCfg = REPOS[activeRepoKey];
  const data = state[repoCfg.key].briefing;
  const card = (data[bucket] || [])[cardIdx];
  if (!card || !card.panelist_quotes || !card.panelist_quotes[quoteIdx]) {
    showToast("발언을 찾을 수 없습니다", "error");
    return;
  }
  const q = card.panelist_quotes[quoteIdx];
  if (!confirm(`"${q.speaker_name || "화자 미상"}"(${q.source_name || "채널 미상"}) 발언을 삭제할까요? (아직 저장은 안 됩니다 — 승인 전까지는 임시 반영)`)) return;
  card.panelist_quotes.splice(quoteIdx, 1);
  _markPending(repoCfg, { action: "delete_panelist_quote", detail: `${q.speaker_name || "화자 미상"} (${card.name})` });
  showToast(`🗑 패널 발언 삭제 임시 반영 — 승인 전까지 저장 안 됨`);
  renderCorrectPanelist_stock(document.getElementById("correct-tab-body"), repoCfg);
}

          border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem;">
      </div>
      <button class="btn" style="background:var(--accent);color:#000;" onclick="fetchVideoMeta()">🔍 제목·썸네일 가져오기</button>
      <div id="video-fetch-preview"></div>
    </div>`;
}

function extractYoutubeVideoId(url) {
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

async function fetchVideoMeta() {
  const urlInput = document.getElementById("video-url-input");
  const url = urlInput.value.trim();
  const previewEl = document.getElementById("video-fetch-preview");
  if (!url) { showToast("유튜브 URL을 입력하세요", "error"); return; }
  const videoId = extractYoutubeVideoId(url);
  if (!videoId) { showToast("유효한 유튜브 URL이 아닙니다 (watch?v=.../youtu.be/... 형식)", "error"); return; }
  _fetchedVideoMeta = null;
  previewEl.innerHTML = `<div class="loading" style="padding:1rem 0;"><span class="spinner"></span>메타데이터 가져오는 중...</div>`;
  try {
    const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);
    if (!r.ok) throw new Error(`oEmbed 조회 실패 (${r.status}) — 비공개/삭제된 영상이거나 URL이 올바르지 않을 수 있습니다`);
    const meta = await r.json();
    const thumbnail = meta.thumbnail_url || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
    _fetchedVideoMeta = { url, video_id: videoId, title: meta.title || "", thumbnail };
    previewEl.innerHTML = `
      <div class="preview-card" style="margin-top:1rem;">
        <div class="preview-card-name">🔍 미리보기</div>
        <div style="display:flex;gap:1rem;align-items:flex-start;margin-top:.5rem;flex-wrap:wrap;">
          <img src="${escapeHtml(thumbnail)}" style="width:160px;border-radius:8px;border:1px solid var(--border);">
          <div style="flex:1;min-width:200px;">
            <div style="font-weight:700;margin-bottom:.3rem;">${escapeHtml(meta.title || "")}</div>
            <div style="font-size:.8rem;color:var(--muted);">${escapeHtml(meta.author_name || "")}</div>
          </div>
        </div>
        <button class="btn btn-approve" style="margin-top:.75rem;" onclick="applyVideoLink()">✅ 이 영상으로 등록 (임시 반영)</button>
      </div>`;
  } catch(e) {
    previewEl.innerHTML = `
      <div class="empty" style="color:var(--red);text-align:left;padding:.75rem 0;">
        ❌ 자동 조회 실패: ${escapeHtml(e.message)}<br>
        <span style="font-size:.78rem;color:var(--muted);">브라우저가 유튜브 oEmbed 요청을 막았을 수 있습니다 — 제목을 직접 입력해 등록하세요.</span>
      </div>
      <div style="display:flex;gap:.5rem;">
        <input id="video-title-manual" type="text" placeholder="영상 제목 직접 입력"
          style="flex:1;padding:.55rem .8rem;background:var(--surface2);
          border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem;">
        <button class="btn btn-approve" onclick="applyVideoLinkManual('${url.replace(/'/g, "\\'")}', '${videoId}')">✅ 등록</button>
      </div>`;
  }
}

function applyVideoLink() {
  if (!_fetchedVideoMeta) { showToast("먼저 메타데이터를 가져오세요", "error"); return; }
  const repoCfg = REPOS[activeRepoKey];
  const data = state[repoCfg.key].briefing;
  data.video = { ..._fetchedVideoMeta };
  _markPending(repoCfg, { action: "set_video", detail: `영상 등록: ${_fetchedVideoMeta.title}` });
  _fetchedVideoMeta = null;
  _renderVideoInner(repoCfg);
  _refreshVideoPendingBar(repoCfg);
  showToast("📝 영상 임시 반영 완료 — 승인해야 페이지에 표출됩니다");
}

function applyVideoLinkManual(url, videoId) {
  const titleInput = document.getElementById("video-title-manual");
  const title = titleInput ? titleInput.value.trim() : "";
  if (!title) { showToast("제목을 입력하세요", "error"); return; }
  const repoCfg = REPOS[activeRepoKey];
  const data = state[repoCfg.key].briefing;
  data.video = { url, video_id: videoId, title, thumbnail: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` };
  _markPending(repoCfg, { action: "set_video", detail: `영상 등록(수동): ${title}` });
  _renderVideoInner(repoCfg);
  _refreshVideoPendingBar(repoCfg);
  showToast("📝 영상 임시 반영 완료 — 승인해야 페이지에 표출됩니다");
}

function clearVideoLink() {
  const repoCfg = REPOS[activeRepoKey];
  const data = state[repoCfg.key].briefing;
  if (!confirm("등록된 영상 링크를 제거할까요? (페이지에서 다시 숨겨집니다 — 아직 저장은 안 됩니다)")) return;
  data.video = null;
  _markPending(repoCfg, { action: "clear_video", detail: "영상 링크 제거" });
  _renderVideoInner(repoCfg);
  _refreshVideoPendingBar(repoCfg);
  showToast("📝 영상 제거 임시 반영 — 승인 전까지 저장 안 됨");
}

function _refreshVideoPendingBar(repoCfg) {
  const el = document.getElementById("video-pending-bar");
  if (!el) return;
  const st = state[repoCfg.key];
  if (!st.pending) {
    el.innerHTML = `<div class="pending-bar empty-state" style="margin-top:1.2rem;"><div class="pending-bar-title">✅ 저장되지 않은 변경사항 없음</div></div>`;
    return;
  }
  el.innerHTML = `
    <div class="pending-bar" style="margin-top:1.2rem;">
      <div class="pending-bar-title">⏳ 저장되지 않은 변경 ${st.pendingLog.length}건 — 승인해야 실제 페이지에 반영됩니다</div>
      <ul class="pending-list">${st.pendingLog.map(e => `<li>▸ ${escapeHtml(e.detail || e.action || "")}</li>`).join("")}</ul>
      <div class="btn-row" style="margin-top:0;">
        <button class="btn btn-approve" onclick="approveChanges()">✅ 변경 승인 (JSON 저장 + 페이지 재생성)</button>
        <button class="btn btn-reject" onclick="discardChanges()">↩️ 변경 취소</button>
      </div>
      <div id="workflow-status" class="workflow-status"></div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════════
// ADMIN-THUMBNAIL-EDIT-1: STEP-1 전용 — 🖼️ 썸네일 수정
// stock-briefing-step1의 morning_core.yml이 매 실행마다 docs/thumbnails/
// latest_{1,2}.png + latest_meta.json(선정된 발언/종목 candidate 원본 + 현재
// 문구)을 커밋해둔다. 이 탭은 그 두 이미지를 raw.githubusercontent.com으로
// 그대로 보여주고, 문구를 고쳐 카드별 "재생성" 버튼을 누르면 step1의
// regenerate_thumbnail.yml(workflow_dispatch, 입력 which/title)을 트리거한다.
// 다른 탭들과 달리 "변경 승인" 배치 큐를 쓰지 않는다 — 카드 하나당 즉시
// 트리거 → 폴링 → 이미지 교체가 자연스러운 단위 작업이라 그대로 두는 편이
// 더 단순하다. 후보(어떤 발언/종목을 쓸지) 자체를 바꾸는 기능은 없다 —
// morning_core.yml을 다시 돌려야 한다(문구만 다듬는 용도).
const THUMB_META_PATH = "docs/thumbnails/latest_meta.json";
const THUMB_WORKFLOW_FILE = "regenerate_thumbnail.yml";

function thumbRawUrl(repoCfg, name) {
  return `https://raw.githubusercontent.com/${repoCfg.repo}/${repoCfg.branch}/docs/thumbnails/${name}?t=${Date.now()}`;
}

async function renderThumbnailTab(el, repoCfg) {
  el.innerHTML = `<div class="loading"><span class="spinner"></span>불러오는 중...</div>`;
  try {
    const { data, error } = await readJson(repoCfg, THUMB_META_PATH, null);
    if (!data) {
      el.innerHTML = `<div class="empty">아직 생성된 썸네일이 없습니다 — stock-briefing-step1의 morning_core 워크플로우를 먼저 실행하세요.${error ? `<br><span style="font-size:.75rem;">(${escapeHtml(error.message)})</span>` : ""}</div>`;
      return;
    }
    _renderThumbnailCards(el, repoCfg, data);
  } catch(e) {
    el.innerHTML = `<div class="empty" style="color:var(--red);">로드 실패: ${escapeHtml(e.message)}</div>`;
  }
}

function _renderThumbnailCards(el, repoCfg, meta) {
  const card = (which, label, imgName) => {
    const entry = meta[which];
    if (!entry) {
      return `
        <div class="card" style="padding:1.1rem;margin-bottom:1rem;">
          <div class="section-title" style="font-size:.95rem;">${label}</div>
          <div class="empty">오늘은 이 유형의 후보가 없었습니다.</div>
        </div>`;
    }
    return `
      <div class="card" style="padding:1.1rem;margin-bottom:1rem;">
        <div class="section-title" style="font-size:.95rem;">${label}
          <span class="card-meta">${escapeHtml(entry.candidate?.stock_name || "")}</span>
        </div>
        <img src="${thumbRawUrl(repoCfg, imgName)}" id="thumb-img-${which}"
          style="width:100%;max-width:480px;border-radius:8px;border:1px solid var(--border);margin-bottom:.8rem;display:block;">
        <div class="field-block">
          <div class="field-label">문구 (줄바꿈은 그 자리에서 그냥 줄을 바꿔 입력하면 됩니다)</div>
          <textarea id="thumb-title-${which}" class="field-textarea" rows="3">${escapeHtml(entry.title || "")}</textarea>
        </div>
        <button class="btn btn-approve" onclick="submitThumbnailEdit('${which}')">🔄 이 문구로 재생성</button>
        <div id="thumb-status-${which}" class="workflow-status"></div>
      </div>`;
  };
  el.innerHTML = `
    <div class="section-title">🖼️ 오늘의 썸네일 수정
      <span class="badge badge-blue">${escapeHtml(meta.date || "")}</span>
    </div>
    <div class="notice">
      문구를 고치고 "재생성"을 누르면 별도 워크플로우가 1~2분 안에 새 썸네일을
      만듭니다(OpenAI/TTS 재호출 없음, 무료). 후보 종목·발언 자체를 바꾸려면
      stock-briefing-step1의 morning_core 워크플로우를 다시 돌려야 합니다.
    </div>
    ${card("quote", "🗣️ 발언형", "latest_1.png")}
    ${card("news", "📰 뉴스형", "latest_2.png")}
  `;
}

async function submitThumbnailEdit(which) {
  const repoCfg = REPOS.step1;
  const titleEl = document.getElementById(`thumb-title-${which}`);
  const statusEl = document.getElementById(`thumb-status-${which}`);
  const title = titleEl ? titleEl.value : "";
  if (!title.trim()) { showToast("문구를 입력하세요", "error"); return; }
  if (!GH_TOKEN) { showToast("GitHub 토큰이 필요합니다", "error"); return; }
  if (statusEl) statusEl.textContent = "🚀 재생성 워크플로우 트리거 중...";
  const dispatchedAt = new Date();
  try {
    const r = await fetch(
      `https://api.github.com/repos/${repoCfg.repo}/actions/workflows/${THUMB_WORKFLOW_FILE}/dispatches`,
      {
        method: "POST",
        headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json",
                   "Content-Type": "application/json" },
        body: JSON.stringify({ ref: repoCfg.branch, inputs: { which, title } })
      }
    );
    if (!r.ok) {
      const t = await r.text().catch(() => "");
      throw new Error(`트리거 실패 (${r.status}): ${t.slice(0, 200)}`);
    }
    pollThumbnailWorkflow(repoCfg, which, dispatchedAt, 0);
  } catch(e) {
    if (statusEl) statusEl.textContent = `❌ ${e.message}`;
    else showToast(e.message, "error");
  }
}

async function pollThumbnailWorkflow(repoCfg, which, dispatchedAt, attempts) {
  const statusEl = document.getElementById(`thumb-status-${which}`);
  if (!statusEl) return;
  try {
    const r = await fetch(
      `https://api.github.com/repos/${repoCfg.repo}/actions/workflows/${THUMB_WORKFLOW_FILE}/runs?per_page=5`,
      { headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json" }, cache: "no-store" }
    );
    const j = await r.json();
    const run = (j.workflow_runs || []).find(x => new Date(x.created_at) >= dispatchedAt);
    if (run) {
      if (run.status !== "completed") {
        statusEl.textContent = `⏳ 재생성 중... (${run.status})`;
      } else if (run.conclusion === "success") {
        statusEl.textContent = "✅ 재생성 완료";
        const img = document.getElementById(`thumb-img-${which}`);
        if (img) img.src = thumbRawUrl(repoCfg, which === "quote" ? "latest_1.png" : "latest_2.png");
        return;
      } else {
        statusEl.textContent = `❌ 실패 (${run.conclusion}) — step1 저장소 Actions 탭에서 확인하세요.`;
        return;
      }
    } else {
      statusEl.textContent = "⏳ 워크플로우 시작 대기 중...";
    }
  } catch(e) {
    statusEl.textContent = `⚠️ 상태 확인 중 오류: ${e.message}`;
  }
  if (attempts < 30) {
    setTimeout(() => pollThumbnailWorkflow(repoCfg, which, dispatchedAt, attempts + 1), 4000);
  } else {
    statusEl.textContent = "⚠️ 상태 확인 시간 초과 — Actions 탭에서 직접 확인하세요.";
  }
}
</script>
