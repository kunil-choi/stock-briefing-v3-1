name: V3_1 morning_core 데이터 생성

on:
  schedule:
    # 정각(0분)은 GitHub Actions 스케줄 실행이 몰려 지연되거나 드물게 아예
    # 스킵되는 시간대라 7분 오프셋을 둔다 (2026-08-07 07:00 KST 실행 누락 재발 방지).
    - cron: '7 22 * * 0-4'    # KST 월~금 07:07 (UTC 전날 22:07)
  workflow_dispatch:
    inputs:
      skip_youtube:
        description: '유튜브 수집 스킵'
        required: false
        default: 'false'
        type: boolean
      force_rerun:
        description: '체크포인트 무시하고 처음부터 강제 재실행 (코드 수정 후 같은 날 재실행할 때 사용)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 🖋️ 시스템 의존성 설치 (한글 폰트)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            fonts-nanum \
            fonts-nanum-coding \
            libfreetype6-dev \
            libpng-dev \
            pkg-config
          fc-cache -fv || true

      - name: 📦 Python 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 API 키 점검
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN:          ${{ secrets.GH_TOKEN }}
        run: |
          python - <<'EOF'
          import os, sys
          keys = {
              "ANTHROPIC_API_KEY": os.getenv("ANTHROPIC_API_KEY"),
              "YOUTUBE_API_KEY":   os.getenv("YOUTUBE_API_KEY"),
              "GH_TOKEN":          os.getenv("GH_TOKEN"),
          }
          missing = [k for k, v in keys.items() if not v]
          for k in missing:
              print(f"⚠️  {k} 누락")
          if "ANTHROPIC_API_KEY" in missing:
              print("❌ ANTHROPIC_API_KEY 없음 → 실행 중단")
              sys.exit(1)
          print("✅ 필수 키 확인 완료")
          EOF

      - name: 🎨 Matplotlib 백엔드 설정
        run: |
          mkdir -p ~/.config/matplotlib
          echo "backend: Agg" > ~/.config/matplotlib/matplotlibrc

      - name: 📊 morning_core 데이터 생성 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN:          ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          SKIP_YOUTUBE:      ${{ github.event.inputs.skip_youtube || 'false' }}
          FORCE_RERUN:       ${{ github.event.inputs.force_rerun || 'false' }}
          MPLBACKEND:        Agg
          PYTHONUNBUFFERED:  "1"
        run: python main.py

      - name: ✅ 결과물 검증
        run: |
          if [ ! -f data/briefing_data.json ]; then
            echo "❌ data/briefing_data.json 없음"
            exit 1
          fi
          TODAY=$(TZ='Asia/Seoul' date +'%Y%m%d')
          if [ ! -f "data/raw_${TODAY}.json" ]; then
            echo "❌ data/raw_${TODAY}.json 없음 (V3_2가 이 파일을 재사용함)"
            exit 1
          fi
          if [ ! -f docs/index.html ]; then
            echo "❌ docs/index.html 없음"
            exit 1
          fi
          SIZE=$(wc -c < docs/index.html)
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ docs/index.html 너무 작음 (${SIZE} bytes)"
            exit 1
          fi
          echo "✅ briefing_data.json / raw_${TODAY}.json / docs/index.html (${SIZE} bytes) 정상 생성"

      - name: 🚀 변경사항 커밋 및 푸시
        id: commit_push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ docs/
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️  변경사항 없음 → 커밋 스킵"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "📊 V3_1 morning_core 데이터 갱신: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            # PUSH-DETACHED-HEAD-1: actions/checkout@v4는 detached HEAD 상태로
            # 체크아웃하므로 인자 없는 `git push`는 "not currently on a branch"로
            # 무조건 실패한다 — HEAD:main으로 대상 브랜치를 명시해 detached
            # 상태에서도 push되게 한다. 실패 시 재시도 전에 이전 시도가 남겼을
            # 수 있는 rebase 상태를 정리하고, 충돌은 방금 재생성한 내용을
            # 우선(rebase에서 -X theirs = 리플레이되는 내 커밋 우선)해 해결한다.
            # 이전엔 3회 재시도가 전부 실패해도 committed=true를 무조건 출력해
            # 실제로는 아무것도 push되지 않았는데 워크플로우가 초록불로
            # 끝나버리는 사고(2026-08-05 강제 재실행 결과 유실)가 있었다 —
            # 이제 최종 실패 시 워크플로우 자체를 실패 처리한다.
            PUSHED=false
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                PUSHED=true
                break
              fi
              echo "⚠️  push 실패 (${i}회) → 최신 main 기준으로 리베이스 후 재시도"
              git fetch origin main
              git rebase --abort >/dev/null 2>&1 || true
              git rebase -X theirs origin/main
              sleep 3
            done
            if [ "$PUSHED" = "true" ]; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
            else
              echo "❌ 3회 재시도 후에도 push 실패 — 이번 실행 결과가 저장되지 않았습니다"
              exit 1
            fi
          fi

      # stock-briefing-step1(morning_core.yml, 실제 영상 생성 — OpenAI/TTS 과금 발생)은
      # 더 이상 여기서 자동 트리거하지 않는다. 데이터(docs/index.html)를 사람이 먼저
      # 확인한 뒤 step1 저장소 Actions 탭에서 수동으로 workflow_dispatch 실행한다
      # (과금 방지를 위한 의도적 변경).
      - name: 📡 stock-briefing-v3-2 트리거
        if: steps.commit_push.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CLEAN_TOKEN="$(printf '%s' "${GH_TOKEN}" | tr -d '\n\r ')"
          response=$(curl -sS -o /tmp/dispatch_v32.txt -w "%{http_code}" -X POST \
            -H "Authorization: token ${CLEAN_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/kunil-choi/stock-briefing-v3-2/actions/workflows/main.yml/dispatches \
            -d '{"ref":"main"}')
          if [ "$response" != "204" ]; then
            echo "❌ stock-briefing-v3-2 dispatch 실패 (HTTP ${response})"
            cat /tmp/dispatch_v32.txt
            exit 1
          fi
          echo "✅ stock-briefing-v3-2의 main.yml 트리거 완료"

      - name: 📋 실행 요약 (항상 출력)
        if: always()
        run: |
          echo "=============================="
          echo "KST 현재시각: $(TZ='Asia/Seoul' date)"
          if [ -f data/briefing_data.json ]; then
            echo "briefing_data.json 크기: $(wc -c < data/briefing_data.json) bytes"
          else
            echo "briefing_data.json: 없음"
          fi
          echo "=============================="
