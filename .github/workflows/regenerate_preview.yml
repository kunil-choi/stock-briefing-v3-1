name: 프리뷰(docs/index.html) 재생성

# 관리자 페이지(docs/admin/)에서 브리핑 교정을 "승인"하면 이 워크플로우가
# workflow_dispatch로 트리거된다. data/briefing_data.json은 관리자 페이지가
# GitHub API로 이미 직접 커밋해 둔 뒤이므로, 여기서는 scripts/regenerate_preview.py로
# 그 최신 JSON을 docs/index.html에 다시 반영하기만 한다 — Claude/Gemini/수집기
# 호출이 전혀 없어 몇 초 안에 끝나고 비용도 들지 않는다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔄 docs/index.html 재생성
        run: python scripts/regenerate_preview.py

      - name: 🚀 변경사항 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "ℹ️  변경사항 없음 → 커밋 스킵"
          else
            git commit -m "🩹 관리자 교정 반영: docs/index.html 재생성 ($(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST'))"
            # PUSH-DETACHED-HEAD-1: actions/checkout@v4는 detached HEAD 상태로
            # 체크아웃하므로 인자 없는 `git push`는 "not currently on a branch"로
            # 무조건 실패한다 — HEAD:main으로 대상 브랜치를 명시해 detached
            # 상태에서도 push되게 한다. 실패 시 재시도 전에 이전 시도가 남겼을
            # 수 있는 rebase 상태를 정리하고, 충돌은 방금 재생성한 내용을
            # 우선(rebase에서 -X theirs = 리플레이되는 내 커밋 우선)해 해결한다.
            # 3회 재시도가 전부 실패하면 워크플로우 자체를 실패 처리해, push
            # 안 된 결과가 조용히 사라지는 일이 없게 한다.
            PUSHED=false
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                PUSHED=true
                break
              fi
              echo "⚠️  push 실패 (${i}회) → 최신 main 기준으로 리베이스 후 재시도"
              git fetch origin main
              git rebase --abort >/dev/null 2>&1 || true
              git rebase -X theirs origin/main
              sleep 3
            done
            if [ "$PUSHED" != "true" ]; then
              echo "❌ 3회 재시도 후에도 push 실패 — docs/index.html 재생성 결과가 저장되지 않았습니다"
              exit 1
            fi
          fi
